<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1800" viewBox="0 0 2800 1800">
  <defs>
    <style>
      .bg{fill:#fff}
      .title{font-family:"SimSun","宋体","Noto Serif CJK SC",serif;font-size:31px;font-weight:700;fill:#17202a}
      .stage-title{font-family:"SimSun","宋体","Noto Serif CJK SC",serif;font-size:25px;font-weight:700;fill:#17202a}
      .box-title{font-family:"SimSun","宋体","Noto Serif CJK SC",serif;font-size:20px;font-weight:700;fill:#17202a}
      .text{font-family:"SimSun","宋体","Noto Serif CJK SC",serif;font-size:16px;fill:#26323d}
      .small{font-family:"SimSun","宋体","Noto Serif CJK SC",serif;font-size:14px;fill:#3c4853}
      .tiny{font-family:"SimSun","宋体","Noto Serif CJK SC",serif;font-size:13px;fill:#4c5964}
      .math{font-family:"Cambria Math","Times New Roman",serif;font-size:18px;font-style:italic;fill:#17202a}
      .stage-cal{fill:#fffaf3;stroke:#d69b45;stroke-width:2.3}
      .stage-op{fill:#f4f9fd;stroke:#5a91bd;stroke-width:2.3}
      .calbox{fill:#fff;stroke:#b77726;stroke-width:2}
      .calhead{fill:#f7e8d0;stroke:none}
      .sourcebox{fill:#fff;stroke:#4d8f68;stroke-width:2}
      .sourcehead{fill:#e4f2e8;stroke:none}
      .coilbox{fill:#fff;stroke:#4e85a6;stroke-width:2}
      .coilhead{fill:#e2eff6;stroke:none}
      .verifybox{fill:#fff;stroke:#75549b;stroke-width:2}
      .verifyhead{fill:#eee7f5;stroke:none}
      .opbox{fill:#fff;stroke:#4f82aa;stroke-width:2}
      .ophead{fill:#dcecf7;stroke:none}
      .targetbox{fill:#fff;stroke:#6f5c99;stroke-width:2}
      .targethead{fill:#eee9f7;stroke:none}
      .freeze{fill:#eef7eb;stroke:#4f8c50;stroke-width:2.4}
      .archive{fill:#f6f7f8;stroke:#68737d;stroke-width:1.8}
      .decision{fill:#fff;stroke:#825ba6;stroke-width:2.3}
      .flow{fill:none;stroke:#26323d;stroke-width:2.5;marker-end:url(#arrow)}
      .flow-thin{fill:none;stroke:#3d4954;stroke-width:1.9;marker-end:url(#arrow)}
      .cal-flow{fill:none;stroke:#9b6725;stroke-width:2.2;marker-end:url(#arrow-cal)}
      .op-flow{fill:none;stroke:#386d96;stroke-width:2.4;marker-end:url(#arrow-op)}
      .dash{fill:none;stroke:#6f5c99;stroke-width:2;stroke-dasharray:9 6;marker-end:url(#arrow-purple)}
      .data{fill:none;stroke:#5c6770;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#arrow-open)}
      .prohibit{fill:none;stroke:#b43e3e;stroke-width:2.4;stroke-dasharray:9 6}
      .lane-source{fill:#f2f8f4;stroke:#87ae94;stroke-width:1.5;stroke-dasharray:6 5}
      .lane-coil{fill:#f1f7fb;stroke:#89afc4;stroke-width:1.5;stroke-dasharray:6 5}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#26323d"/></marker>
    <marker id="arrow-cal" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#9b6725"/></marker>
    <marker id="arrow-op" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#386d96"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#6f5c99"/></marker>
    <marker id="arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#5c6770" stroke-width="1.5"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="2800" height="1800"/>
  <text class="title" x="1400" y="48" text-anchor="middle">图3　台架模型标定、参数固化以及航行阶段模型前馈补偿的两阶段算法流程图</text>

  <!-- 第一阶段：台架标定 -->
  <rect class="stage-cal" x="35" y="78" width="2730" height="810" rx="8"/>
  <text class="stage-title" x="70" y="118">阶段Ⅰ　台架模型标定与联合验证（高精度多点矢量磁测装置510临时接入）</text>

  <rect class="calbox" x="75" y="200" width="300" height="225" rx="6"/>
  <rect class="calhead" x="76" y="201" width="298" height="49" rx="5"/>
  <text class="box-title" x="225" y="233" text-anchor="middle">1　标定准备</text>
  <text class="text" x="100" y="282">• 固定磁力仪、线圈与主要磁源</text>
  <text class="text" x="100" y="315">• 建立共同坐标系与参考点O</text>
  <text class="text" x="100" y="348">• 标定S1—SN的位置与三轴方向</text>
  <text class="text" x="100" y="381">• 检查环境稳定性、量程和噪声</text>

  <rect class="calbox" x="435" y="200" width="300" height="225" rx="6"/>
  <rect class="calhead" x="436" y="201" width="298" height="49" rx="5"/>
  <text class="box-title" x="585" y="233" text-anchor="middle">2　同步采集与基线</text>
  <text class="text" x="460" y="282">• 源状态、运动状态与线圈电流</text>
  <text class="text" x="460" y="315">• 多点三轴矢量场与铯光泵总场</text>
  <text class="text" x="460" y="348">• 统一时基、通道时延与重采样</text>
  <text class="text" x="460" y="381">• 记录基准场、温度和零偏</text>
  <path class="cal-flow" d="M375 313 H435"/>

  <!-- 双标定支路背景 -->
  <rect class="lane-source" x="785" y="145" width="1040" height="305" rx="7"/>
  <text class="box-title" x="810" y="178">A　内生磁源—场/梯度标定支路</text>
  <rect class="lane-coil" x="785" y="475" width="1040" height="305" rx="7"/>
  <text class="box-title" x="810" y="508">B　补偿线圈电流—场/梯度标定支路</text>

  <rect class="sourcebox" x="815" y="205" width="285" height="205" rx="6"/>
  <rect class="sourcehead" x="816" y="206" width="283" height="46" rx="5"/>
  <text class="box-title" x="957" y="237" text-anchor="middle">3A　多源组合激励</text>
  <text class="text" x="840" y="285">推进：电流、转速、占空比</text>
  <text class="text" x="840" y="317">电源：负载、母线电流、变换状态</text>
  <text class="text" x="840" y="349">机构：位置、速度及典型动作序列</text>
  <text class="small" x="840" y="382">采用单源、多源及未见组合工况</text>

  <rect class="sourcebox" x="1140" y="205" width="285" height="205" rx="6"/>
  <rect class="sourcehead" x="1141" y="206" width="283" height="46" rx="5"/>
  <text class="box-title" x="1282" y="237" text-anchor="middle">4A　场—梯度观测</text>
  <text class="text" x="1165" y="285">510：多点三轴矢量磁场</text>
  <text class="text" x="1165" y="317">520：参考点三轴场与选定梯度</text>
  <text class="text" x="1165" y="349">条件数检查、异常剔除与协方差</text>
  <text class="math" x="1165" y="386">dcal,obs = [B̂₀, Ĝsel]ᵀ</text>

  <rect class="sourcebox" x="1465" y="205" width="325" height="205" rx="6"/>
  <rect class="sourcehead" x="1466" y="206" width="323" height="46" rx="5"/>
  <text class="box-title" x="1627" y="237" text-anchor="middle">5A　源—场模型辨识310</text>
  <text class="math" x="1490" y="287">d̂self(t)=fθ[xs(t),xs(t−Δt),…]</text>
  <text class="text" x="1490" y="323">物理模型、数据模型或混合模型</text>
  <text class="text" x="1490" y="355">辨识动态时延、磁滞、温度及非线性</text>
  <text class="small" x="1490" y="387">输出候选参数 θ 与适用工况范围</text>

  <rect class="coilbox" x="815" y="535" width="285" height="205" rx="6"/>
  <rect class="coilhead" x="816" y="536" width="283" height="46" rx="5"/>
  <text class="box-title" x="957" y="567" text-anchor="middle">3B　逐通道线圈激励</text>
  <text class="text" x="840" y="615">各通道施加正、负多级已知电流</text>
  <text class="text" x="840" y="647">记录实际电流、电压、功率和温度</text>
  <text class="text" x="840" y="679">等待场稳定或记录动态阶跃响应</text>
  <text class="small" x="840" y="712">覆盖预定工作区并避免线圈过热</text>

  <rect class="coilbox" x="1140" y="535" width="285" height="205" rx="6"/>
  <rect class="coilhead" x="1141" y="536" width="283" height="46" rx="5"/>
  <text class="box-title" x="1282" y="567" text-anchor="middle">4B　场—梯度观测</text>
  <text class="text" x="1165" y="615">510/520同步解算线圈作用量</text>
  <text class="text" x="1165" y="647">扣除基准场与可测环境变化</text>
  <text class="text" x="1165" y="679">铯光泵总场用于核对总场方向响应</text>
  <text class="small" x="1165" y="712">铯光泵不单独承担梯度辨识</text>

  <rect class="coilbox" x="1465" y="535" width="325" height="205" rx="6"/>
  <rect class="coilhead" x="1466" y="536" width="323" height="46" rx="5"/>
  <text class="box-title" x="1627" y="567" text-anchor="middle">5B　线圈响应模型410</text>
  <text class="math" x="1490" y="617">yc = Kc(T)u</text>
  <text class="text" x="1490" y="653">辨识场/梯度增益、轴间与通道间耦合</text>
  <text class="text" x="1490" y="685">估计偏置、非线性、温度系数和时延</text>
  <text class="small" x="1490" y="717">输出候选 Kc(T) 与可控自由度判定</text>

  <!-- 支路连接 -->
  <path class="cal-flow" d="M735 300 H770 V307 H815"/>
  <path class="cal-flow" d="M735 325 H770 V637 H815"/>
  <path class="cal-flow" d="M1100 307 H1140"/>
  <path class="cal-flow" d="M1425 307 H1465"/>
  <path class="cal-flow" d="M1100 637 H1140"/>
  <path class="cal-flow" d="M1425 637 H1465"/>

  <!-- 残差评估、验证和验收 -->
  <rect class="verifybox" x="1870" y="230" width="330" height="320" rx="6"/>
  <rect class="verifyhead" x="1871" y="231" width="328" height="48" rx="5"/>
  <text class="box-title" x="2035" y="263" text-anchor="middle">6　标定残差评估与有限修正</text>
  <text class="math" x="1895" y="320">d̂res,cal=d̂self+Kcu_cal</text>
  <text class="math" x="1895" y="357">r_cal=d_cal,obs−d̂res,cal</text>
  <text class="text" x="1895" y="402">• 按源状态相关性分解残差</text>
  <text class="text" x="1895" y="435">• 在预设参数范围内有界修正</text>
  <text class="text" x="1895" y="468">• 使用正则化抑制病态与过拟合</text>
  <text class="small" x="1895" y="510">残差仅用于台架离线修正，不作为航行反馈量</text>

  <rect class="verifybox" x="2250" y="180" width="330" height="280" rx="6"/>
  <rect class="verifyhead" x="2251" y="181" width="328" height="48" rx="5"/>
  <text class="box-title" x="2415" y="213" text-anchor="middle">7　未见工况联合验证</text>
  <text class="text" x="2275" y="270">• 未参与辨识的多源组合工况</text>
  <text class="text" x="2275" y="303">• 场误差、梯度误差与时序误差</text>
  <text class="text" x="2275" y="336">• 稳定性、重复性及跨温度一致性</text>
  <text class="text" x="2275" y="369">• 线圈工作区、秩与条件数检查</text>
  <text class="small" x="2275" y="413">模型版本、标定日期和适用范围同时归档</text>

  <polygon class="decision" points="2415,515 2575,625 2415,735 2255,625"/>
  <text class="box-title" x="2415" y="610" text-anchor="middle">达到预设</text>
  <text class="box-title" x="2415" y="640" text-anchor="middle">标定验收条件？</text>
  <path class="cal-flow" d="M1790 307 H1870"/>
  <path class="cal-flow" d="M1790 637 H1830 V480 H1870"/>
  <path class="cal-flow" d="M2200 390 H2250"/>
  <path class="cal-flow" d="M2415 460 V515"/>
  <text class="small" x="2430" y="493">检验</text>

  <path class="dash" d="M2255 625 H2215 V830 H1627 V740"/>
  <path class="dash" d="M2215 830 H1282 V740"/>
  <text class="small" x="2230" y="660">否：补充工况或调整模型</text>
  <path class="cal-flow" d="M2575 625 H2670 V845 H2220"/>
  <text class="small" x="2590" y="606">是</text>

  <rect class="archive" x="1870" y="590" width="300" height="210" rx="6"/>
  <text class="box-title" x="2020" y="628" text-anchor="middle">独立台架标定档案</text>
  <text class="text" x="1895" y="671">• 原始多点矢量磁场数据</text>
  <text class="text" x="1895" y="704">• 场—梯度解算结果与协方差</text>
  <text class="text" x="1895" y="737">• 标定残差、参数和验收记录</text>
  <text class="small" x="1895" y="772">仅供追溯、离线复核和重新标定判断</text>
  <path class="data" d="M2200 470 H2225 V695 H2170"/>

  <!-- 参数固化过渡带 -->
  <rect class="freeze" x="530" y="915" width="1740" height="145" rx="8"/>
  <text class="stage-title" x="1400" y="952" text-anchor="middle">阶段转换：参数固化、标定设备拆除与任务装载</text>
  <rect class="sourcebox" x="590" y="975" width="420" height="60" rx="5"/>
  <text class="box-title" x="800" y="1002" text-anchor="middle">固化源—场传递模型 θ*／310</text>
  <text class="small" x="800" y="1025" text-anchor="middle">含模型版本、适用工况和预设工作限值</text>
  <rect class="coilbox" x="1065" y="975" width="420" height="60" rx="5"/>
  <text class="box-title" x="1275" y="1002" text-anchor="middle">固化线圈响应模型 Kc*(T)／410</text>
  <text class="small" x="1275" y="1025" text-anchor="middle">含温度修正、耦合、时延和约束参数</text>
  <rect class="archive" x="1540" y="975" width="670" height="60" rx="5"/>
  <text class="box-title" x="1875" y="1002" text-anchor="middle">拆除高精度多点矢量磁测装置510，模型包写入航行器只读存储</text>
  <text class="small" x="1875" y="1025" text-anchor="middle">任务期间禁止利用铯光泵总场在线更新模型参数</text>
  <path class="cal-flow" d="M2220 845 V887 H1400 V915"/>

  <!-- 第二阶段：航行前馈补偿 -->
  <rect class="stage-op" x="35" y="1090" width="2730" height="660" rx="8"/>
  <text class="stage-title" x="70" y="1130">阶段Ⅱ　航行阶段模型前馈补偿（固化模型只读；无在线梯度观测、无总场调零闭环）</text>

  <rect class="opbox" x="75" y="1190" width="285" height="205" rx="6"/>
  <rect class="ophead" x="76" y="1191" width="283" height="46" rx="5"/>
  <text class="box-title" x="217" y="1222" text-anchor="middle">1　状态采集200/210</text>
  <text class="text" x="100" y="1270">源状态：电流、电压、转速、温度</text>
  <text class="text" x="100" y="1302">运动状态：姿态、角速度、速度</text>
  <text class="text" x="100" y="1334">读取实际线圈电流与故障状态</text>
  <text class="small" x="100" y="1367">不采集在线空间梯度</text>

  <rect class="opbox" x="400" y="1190" width="255" height="205" rx="6"/>
  <rect class="ophead" x="401" y="1191" width="253" height="46" rx="5"/>
  <text class="box-title" x="527" y="1222" text-anchor="middle">2　时间同步220</text>
  <text class="text" x="425" y="1270">统一时间戳与通道时延补偿</text>
  <text class="text" x="425" y="1302">状态历史窗构造与有效性检查</text>
  <text class="text" x="425" y="1334">模型版本、温度和任务模式核对</text>
  <text class="small" x="425" y="1367">异常时转入安全输出</text>

  <rect class="opbox" x="695" y="1190" width="300" height="205" rx="6"/>
  <rect class="ophead" x="696" y="1191" width="298" height="46" rx="5"/>
  <text class="box-title" x="845" y="1222" text-anchor="middle">3　自磁场—梯度预测300</text>
  <text class="math" x="720" y="1272">d̂self=fθ*[xs(t),xs(t−Δt),…]</text>
  <text class="text" x="720" y="1310">输出参考点载体自磁场预测量</text>
  <text class="text" x="720" y="1342">输出选定自磁场梯度预测量</text>
  <text class="small" x="720" y="1374">仅调用固化模型，不形成在线残差</text>

  <rect class="opbox" x="1035" y="1190" width="305" height="205" rx="6"/>
  <rect class="ophead" x="1036" y="1191" width="303" height="46" rx="5"/>
  <text class="box-title" x="1187" y="1222" text-anchor="middle">4　约束前馈求解400</text>
  <text class="math" x="1060" y="1272">uop=satC[−Kc*†(T)d̂self]</text>
  <text class="text" x="1060" y="1310">按场/梯度权重求解补偿驱动量</text>
  <text class="text" x="1060" y="1342">限制电流、变化率、功率与温升</text>
  <text class="small" x="1060" y="1374">铯光泵总场与目标异常不进入求解器</text>

  <rect class="opbox" x="1380" y="1190" width="250" height="205" rx="6"/>
  <rect class="ophead" x="1381" y="1191" width="248" height="46" rx="5"/>
  <text class="box-title" x="1505" y="1222" text-anchor="middle">5　恒流驱动420</text>
  <text class="text" x="1405" y="1270">多通道低噪声双向驱动</text>
  <text class="text" x="1405" y="1302">按标定时延在采样窗前实施</text>
  <text class="text" x="1405" y="1334">记录实际电流、电压与温度</text>
  <text class="small" x="1405" y="1367">越限时限幅、降额或安全回零</text>

  <rect class="opbox" x="1670" y="1190" width="260" height="205" rx="6"/>
  <rect class="ophead" x="1671" y="1191" width="258" height="46" rx="5"/>
  <text class="box-title" x="1800" y="1222" text-anchor="middle">6　补偿线圈430/440</text>
  <text class="text" x="1695" y="1270">三轴匀场补偿线圈产生补偿场</text>
  <text class="text" x="1695" y="1302">梯度线圈产生主梯度补偿分量</text>
  <text class="text" x="1695" y="1334">与预测载体自磁场物理叠加</text>
  <text class="small" x="1695" y="1367">不要求将环境总场补偿为零</text>

  <rect class="opbox" x="1970" y="1190" width="285" height="205" rx="6"/>
  <rect class="ophead" x="1971" y="1191" width="283" height="46" rx="5"/>
  <text class="box-title" x="2112" y="1222" text-anchor="middle">7　铯光泵总场测量500</text>
  <text class="text" x="1995" y="1270">输出补偿后的地磁总场标量</text>
  <text class="text" x="1995" y="1302">保留环境场与外部目标磁异常</text>
  <text class="text" x="1995" y="1334">监测动态范围、锁定和信噪状态</text>
  <text class="small" x="1995" y="1367">不产生在线梯度观测或模型反馈</text>

  <rect class="opbox" x="2295" y="1190" width="410" height="205" rx="6"/>
  <rect class="ophead" x="2296" y="1191" width="408" height="46" rx="5"/>
  <text class="box-title" x="2500" y="1222" text-anchor="middle">8　磁探测数据输出700</text>
  <text class="text" x="2320" y="1270">总场、源/运动状态、实际线圈电流</text>
  <text class="text" x="2320" y="1302">模型版本、质量标志和故障标志</text>
  <text class="text" x="2320" y="1334">目标候选标志、任务区域与统一时间戳</text>
  <text class="small" x="2320" y="1367">原始数据保留，供任务后复核</text>

  <path class="op-flow" d="M360 1292 H400"/>
  <path class="op-flow" d="M655 1292 H695"/>
  <path class="op-flow" d="M995 1292 H1035"/>
  <path class="op-flow" d="M1340 1292 H1380"/>
  <path class="op-flow" d="M1630 1292 H1670"/>
  <path class="op-flow" d="M1930 1292 H1970"/>
  <path class="op-flow" d="M2255 1292 H2295"/>

  <!-- 固化模型装载 -->
  <path class="data" d="M800 1060 V1160 H845 V1190"/>
  <text class="small" x="730" y="1148">只读加载 θ*</text>
  <path class="data" d="M1275 1060 V1160 H1187 V1190"/>
  <text class="small" x="1210" y="1148">只读加载 Kc*</text>

  <!-- 外部磁场及目标异常，仅测量链 -->
  <rect class="targetbox" x="1970" y="1110" width="285" height="55" rx="5"/>
  <text class="box-title" x="2112" y="1144" text-anchor="middle">外部环境场／目标磁异常</text>
  <path class="dash" d="M2112 1165 V1190"/>

  <!-- 目标保护支路 -->
  <rect class="targetbox" x="1970" y="1470" width="285" height="150" rx="6"/>
  <rect class="targethead" x="1971" y="1471" width="283" height="43" rx="5"/>
  <text class="box-title" x="2112" y="1500" text-anchor="middle">目标异常候选判定</text>
  <text class="small" x="1995" y="1543">综合异常幅值、持续时间和航速</text>
  <text class="small" x="1995" y="1570">结合空间尺度与任务区域先验</text>
  <text class="small" x="1995" y="1597">只生成候选标志，不改变补偿规律</text>
  <path class="dash" d="M2112 1395 V1470"/>

  <rect class="targetbox" x="2295" y="1470" width="410" height="150" rx="6"/>
  <rect class="targethead" x="2296" y="1471" width="408" height="43" rx="5"/>
  <text class="box-title" x="2500" y="1500" text-anchor="middle">目标保护输出</text>
  <text class="small" x="2320" y="1543">保持源感知前馈补偿驱动量的生成方式</text>
  <text class="small" x="2320" y="1570">标记、保留并上报总场异常及相关状态</text>
  <text class="small" x="2320" y="1597">冻结模型更新并保存可回溯原始数据</text>
  <path class="dash" d="M2255 1545 H2295"/>
  <path class="data" d="M2500 1470 V1395"/>

  <!-- 实际驱动量和状态写入输出 -->
  <path class="data" d="M1505 1395 V1438 H2420 V1395"/>
  <text class="small" x="1805" y="1426">实际驱动量、温度、故障状态及统一时间戳</text>

  <!-- 明确禁止反馈 -->
  <path class="prohibit" d="M1970 1638 H1187 V1395"/>
  <line x1="1600" y1="1618" x2="1640" y2="1658" stroke="#b43e3e" stroke-width="5"/>
  <line x1="1640" y1="1618" x2="1600" y2="1658" stroke="#b43e3e" stroke-width="5"/>
  <rect x="900" y="1652" width="1200" height="52" rx="5" fill="#fff4f4" stroke="#b43e3e" stroke-width="1.8"/>
  <text x="1500" y="1686" text-anchor="middle" font-family="SimSun,宋体,serif" font-size="17" font-weight="700" fill="#a33434">禁止利用铯光泵总场异常在线修正前馈驱动量或更新固化模型</text>

  <rect class="archive" x="75" y="1470" width="1765" height="150" rx="6"/>
  <text class="box-title" x="957" y="1504" text-anchor="middle">航行阶段工作边界与安全策略</text>
  <text class="text" x="105" y="1544">• 每个有效采样周期重复步骤1—8，但 θ* 与 Kc*(T) 在单次任务期间保持不变；不存在由铯光泵总场构造的在线残差闭环。</text>
  <text class="text" x="105" y="1577">• 预测量或线圈状态接近工作限值时，执行限幅、降额或安全回零；同时保留原始数据和质量标志。</text>
  <text class="text" x="105" y="1610">• 任务结束后可将航行数据与台架标定档案离线比较，据此决定是否重新开展台架标定，而非在任务中自动改参。</text>

  <!-- 图例 -->
  <line class="cal-flow" x1="95" y1="1728" x2="195" y2="1728"/>
  <text class="small" x="210" y="1735">台架标定数据流／试验流程</text>
  <line class="op-flow" x1="555" y1="1728" x2="655" y2="1728"/>
  <text class="small" x="670" y="1735">航行前馈计算／物理补偿流程</text>
  <line class="data" x1="1100" y1="1728" x2="1200" y2="1728"/>
  <text class="small" x="1215" y="1735">模型只读装载／记录支路</text>
  <line class="prohibit" x1="1580" y1="1728" x2="1680" y2="1728"/>
  <text class="small" x="1695" y="1735">禁止反馈路径</text>
</svg>
