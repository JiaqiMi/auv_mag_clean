<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1800" viewBox="0 0 2600 1800">
  <defs>
    <style>
      .bg{fill:#fff}
      .title{font-family:"SimSun","宋体","Noto Serif CJK SC",serif;font-size:30px;font-weight:700;fill:#17202a}
      .panel-title{font-family:"SimSun","宋体","Noto Serif CJK SC",serif;font-size:23px;font-weight:700;fill:#17202a}
      .label{font-family:"SimSun","宋体","Noto Serif CJK SC",serif;font-size:19px;font-weight:700;fill:#17202a}
      .text{font-family:"SimSun","宋体","Noto Serif CJK SC",serif;font-size:17px;fill:#27313b}
      .small{font-family:"SimSun","宋体","Noto Serif CJK SC",serif;font-size:15px;fill:#34414d}
      .tiny{font-family:"SimSun","宋体","Noto Serif CJK SC",serif;font-size:13px;fill:#46515b}
      .math{font-family:"Cambria Math","Times New Roman",serif;font-size:22px;font-style:italic;fill:#17202a}
      .frame{fill:#fff;stroke:#707b86;stroke-width:1.8}
      .soft{fill:#f6f8fa;stroke:#58636e;stroke-width:1.7}
      .shell{fill:#f4f6f8;fill-opacity:.68;stroke:#66717c;stroke-width:2.2;stroke-dasharray:8 5}
      .metal{fill:#d9dee3;stroke:#404b55;stroke-width:2.2}
      .metal-dark{fill:#bfc6cd;stroke:#3c4650;stroke-width:2.2}
      .support{fill:#eceff2;stroke:#45515c;stroke-width:2}
      .xcoil{fill:none;stroke:#2d72c7;stroke-width:10}
      .ycoil{fill:none;stroke:#d8792d;stroke-width:10}
      .zcoil{fill:none;stroke:#7850a8;stroke-width:10}
      .gcoil{fill:none;stroke:#269868;stroke-width:10}
      .coil-thin{fill:none;stroke-width:5}
      .sensor{fill:#f1c95b;stroke:#333d46;stroke-width:2.2}
      .sensor-face{fill:#fff4c9;stroke:#333d46;stroke-width:1.5}
      .axis-x{stroke:#c73a3a;stroke-width:4;marker-end:url(#arrow-red)}
      .axis-y{stroke:#2d8a55;stroke-width:4;marker-end:url(#arrow-green)}
      .axis-z{stroke:#2d62b8;stroke-width:4;marker-end:url(#arrow-blue)}
      .line{fill:none;stroke:#313a43;stroke-width:2.2;marker-end:url(#arrow)}
      .line-noarrow{fill:none;stroke:#313a43;stroke-width:2.2}
      .dash{fill:none;stroke:#4a555f;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow-open)}
      .measure{fill:none;stroke:#6c737a;stroke-width:1.7;stroke-dasharray:5 5}
      .callout{fill:#fff;stroke:#4b5660;stroke-width:1.6}
      .callout-head{fill:#e8edf1;stroke:none}
      .accent{fill:#eef5fb;stroke:#5f7182;stroke-width:1.5}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#313a43"/></marker>
    <marker id="arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#4a555f" stroke-width="1.5"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c73a3a"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2d8a55"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2d62b8"/></marker>
    <linearGradient id="cyl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f7f8f9"/><stop offset=".45" stop-color="#c8ced4"/><stop offset=".7" stop-color="#f0f2f4"/><stop offset="1" stop-color="#aeb7bf"/></linearGradient>
  </defs>

  <rect class="bg" x="0" y="0" width="2600" height="1800"/>
  <text class="title" x="1300" y="48" text-anchor="middle">图2　台架阶段铯光泵原子磁力仪、局部补偿线圈组和可拆卸高精度多点矢量磁测装置的空间布置及场—梯度标定原理图</text>

  <!-- (a) 总体纵向布置 -->
  <rect class="frame" x="35" y="82" width="1500" height="770" rx="5"/>
  <text class="panel-title" x="60" y="120">（a）总体纵向布置（台架临时安装状态）</text>

  <rect class="shell" x="105" y="215" width="1340" height="470" rx="210"/>
  <path class="line-noarrow" d="M165 450 H1380" stroke-dasharray="10 7"/>
  <text class="small" x="1340" y="438">纵向基准轴 X</text>

  <!-- 支架与底座 -->
  <rect class="support" x="320" y="660" width="900" height="35" rx="4"/>
  <rect class="support" x="390" y="610" width="35" height="55"/>
  <rect class="support" x="1110" y="610" width="35" height="55"/>
  <text class="small" x="770" y="720" text-anchor="middle">非磁性台架与可重复定位基准</text>

  <!-- 线圈组（侧视） -->
  <ellipse class="xcoil" cx="410" cy="450" rx="27" ry="205"/>
  <ellipse class="xcoil" cx="1125" cy="450" rx="27" ry="205"/>
  <ellipse class="ycoil" cx="590" cy="450" rx="24" ry="170"/>
  <ellipse class="ycoil" cx="945" cy="450" rx="24" ry="170"/>
  <ellipse class="zcoil" cx="650" cy="450" rx="22" ry="190"/>
  <ellipse class="zcoil" cx="885" cy="450" rx="22" ry="190"/>
  <ellipse class="gcoil" cx="700" cy="450" rx="19" ry="142"/>
  <ellipse class="gcoil" cx="835" cy="450" rx="19" ry="142"/>

  <!-- 铯光泵磁力仪 -->
  <rect x="690" y="385" width="190" height="130" rx="18" fill="url(#cyl)" stroke="#3f4952" stroke-width="2.4"/>
  <ellipse class="metal-dark" cx="690" cy="450" rx="25" ry="65"/>
  <ellipse class="metal" cx="880" cy="450" rx="25" ry="65"/>
  <rect class="metal" x="755" y="418" width="62" height="64" rx="8"/>
  <circle cx="786" cy="450" r="9" fill="#fff" stroke="#333" stroke-width="2"/>
  <text class="label" x="785" y="552" text-anchor="middle">500 铯光泵原子磁力仪</text>
  <text class="small" x="785" y="577" text-anchor="middle">O 为铯气室几何中心／标定参考点</text>

  <!-- 临时传感器及非共面位置 -->
  <g>
    <rect class="sensor" x="515" y="275" width="72" height="46" rx="5"/>
    <rect class="sensor-face" x="530" y="286" width="20" height="20" rx="2"/>
    <text class="label" x="551" y="264" text-anchor="middle">S1</text>
    <path class="measure" d="M551 321 L786 450"/>
    <text class="small" x="620" y="348">Δr₁</text>

    <rect class="sensor" x="1015" y="315" width="72" height="46" rx="5"/>
    <rect class="sensor-face" x="1030" y="326" width="20" height="20" rx="2"/>
    <text class="label" x="1051" y="304" text-anchor="middle">S2</text>
    <path class="measure" d="M1015 338 L786 450"/>
    <text class="small" x="934" y="383">Δr₂</text>

    <rect class="sensor" x="560" y="585" width="72" height="46" rx="5"/>
    <rect class="sensor-face" x="575" y="596" width="20" height="20" rx="2"/>
    <text class="label" x="596" y="654" text-anchor="middle">S3</text>
    <path class="measure" d="M596 585 L786 450"/>
    <text class="small" x="663" y="548">Δr₃</text>

    <rect class="sensor" x="965" y="555" width="72" height="46" rx="5"/>
    <rect class="sensor-face" x="980" y="566" width="20" height="20" rx="2"/>
    <text class="label" x="1001" y="628" text-anchor="middle">S4</text>
    <path class="measure" d="M965 578 L786 450"/>
    <text class="small" x="905" y="538">Δr₄</text>
  </g>

  <!-- 标注 -->
  <path class="dash" d="M250 165 H410 V240"/>
  <text class="text" x="120" y="158">三轴匀场补偿线圈430</text>
  <text class="small" x="120" y="181">成对布置，产生参考点均匀补偿场</text>
  <path class="dash" d="M1090 165 H835 V295"/>
  <text class="text" x="1090" y="158">梯度补偿线圈440</text>
  <text class="small" x="1090" y="181">起步阶段优先一个主梯度模态</text>

  <rect class="accent" x="105" y="742" width="1340" height="74" rx="4"/>
  <text class="text" x="775" y="770" text-anchor="middle">510 可拆卸高精度多点矢量磁测装置：S1—S4表示至少四个已知非共面位置的高精度三轴矢量磁传感器。</text>
  <text class="text" x="775" y="799" text-anchor="middle">也可用一只或多只探头依次移动到等效位置；仅在台架标定阶段安装，联合验证完成后拆除。</text>

  <!-- (b) 线圈与磁力仪分解关系 -->
  <rect class="frame" x="1560" y="82" width="1005" height="770" rx="5"/>
  <text class="panel-title" x="1585" y="120">（b）局部补偿线圈组与磁力仪的轴向分解关系</text>
  <path class="measure" d="M1605 450 H2525"/>

  <ellipse class="xcoil" cx="1650" cy="450" rx="24" ry="170"/>
  <ellipse class="xcoil coil-thin" cx="1663" cy="450" rx="24" ry="170"/>
  <text class="small" x="1656" y="255" text-anchor="middle">X轴匀场线圈</text>
  <text class="tiny" x="1656" y="278" text-anchor="middle">Helmholtz对</text>

  <ellipse class="ycoil" cx="1755" cy="450" rx="23" ry="145"/>
  <ellipse class="ycoil coil-thin" cx="1768" cy="450" rx="23" ry="145"/>
  <text class="small" x="1762" y="625" text-anchor="middle">Y轴匀场线圈</text>

  <ellipse class="zcoil" cx="1860" cy="450" rx="22" ry="155"/>
  <ellipse class="zcoil coil-thin" cx="1873" cy="450" rx="22" ry="155"/>
  <text class="small" x="1866" y="255" text-anchor="middle">Z轴匀场线圈</text>

  <ellipse class="gcoil" cx="1960" cy="450" rx="20" ry="125"/>
  <ellipse class="gcoil coil-thin" cx="1973" cy="450" rx="20" ry="125"/>
  <text class="small" x="1966" y="605" text-anchor="middle">主梯度线圈A</text>

  <rect x="2020" y="392" width="270" height="116" rx="15" fill="url(#cyl)" stroke="#3f4952" stroke-width="2.4"/>
  <ellipse class="metal-dark" cx="2020" cy="450" rx="24" ry="58"/>
  <ellipse class="metal" cx="2290" cy="450" rx="24" ry="58"/>
  <rect class="metal" x="2125" y="420" width="58" height="60" rx="8"/>
  <circle cx="2154" cy="450" r="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text class="label" x="2155" y="350" text-anchor="middle">铯光泵原子磁力仪500</text>
  <text class="small" x="2155" y="374" text-anchor="middle">铯气室中心为 O</text>

  <ellipse class="gcoil" cx="2350" cy="450" rx="20" ry="125"/>
  <ellipse class="gcoil coil-thin" cx="2363" cy="450" rx="20" ry="125"/>
  <text class="small" x="2356" y="605" text-anchor="middle">主梯度线圈B</text>

  <ellipse class="xcoil" cx="2470" cy="450" rx="24" ry="170"/>
  <ellipse class="xcoil coil-thin" cx="2483" cy="450" rx="24" ry="170"/>
  <text class="small" x="2476" y="255" text-anchor="middle">X轴匀场线圈</text>
  <text class="tiny" x="2476" y="278" text-anchor="middle">Helmholtz对</text>

  <path class="line" d="M1630 690 H2495"/>
  <text class="text" x="2060" y="724" text-anchor="middle">装配方向 X：所有线圈与铯气室坐标系共同标定，线圈支架采用低磁或非磁材料</text>

  <!-- (c) 正视图 -->
  <rect class="frame" x="35" y="875" width="760" height="845" rx="5"/>
  <text class="panel-title" x="60" y="915">（c）正视图（沿纵向轴观察）</text>
  <g transform="translate(410,1260)">
    <circle class="xcoil" r="265"/>
    <circle class="xcoil coil-thin" r="247"/>
    <ellipse class="ycoil" rx="210" ry="242"/>
    <ellipse class="zcoil" rx="238" ry="190"/>
    <circle class="gcoil" r="145"/>
    <circle class="gcoil coil-thin" r="128"/>
    <rect class="metal" x="-92" y="-92" width="184" height="184" rx="25"/>
    <circle cx="0" cy="0" r="56" fill="#fff" stroke="#46515b" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#1e2730"/>
    <text class="label" x="0" y="16" text-anchor="middle">O</text>

    <rect class="sensor" x="-190" y="-205" width="66" height="42" rx="5"/>
    <text class="label" x="-157" y="-216" text-anchor="middle">S1</text>
    <rect class="sensor" x="130" y="-190" width="66" height="42" rx="5"/>
    <text class="label" x="163" y="-201" text-anchor="middle">S2</text>
    <rect class="sensor" x="-205" y="158" width="66" height="42" rx="5"/>
    <text class="label" x="-172" y="225" text-anchor="middle">S3</text>
    <rect class="sensor" x="142" y="168" width="66" height="42" rx="5"/>
    <text class="label" x="175" y="235" text-anchor="middle">S4</text>
    <path class="measure" d="M-157 -163 L0 0 M163 -148 L0 0 M-172 158 L0 0 M175 168 L0 0"/>
  </g>
  <line class="axis-y" x1="125" y1="1560" x2="215" y2="1560"/>
  <line class="axis-z" x1="125" y1="1560" x2="125" y2="1470"/>
  <circle cx="125" cy="1560" r="7" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="125" cy="1560" r="2.5" fill="#222"/>
  <text class="small" x="225" y="1567">Y</text>
  <text class="small" x="115" y="1458">Z</text>
  <text class="small" x="75" y="1595">X 指向观察者</text>
  <text class="text" x="410" y="1635" text-anchor="middle">四个测点围绕敏感区域分布；其轴向错位关系见（d），从而避免共面退化。</text>
  <text class="small" x="410" y="1670" text-anchor="middle">颜色仅用于区分线圈功能，正式专利黑白化后仍以编号和线型识别。</text>

  <!-- (d) 侧视图 -->
  <rect class="frame" x="820" y="875" width="700" height="845" rx="5"/>
  <text class="panel-title" x="845" y="915">（d）侧视图（显示测点轴向错位）</text>
  <path class="measure" d="M900 1270 H1450"/>
  <ellipse class="xcoil" cx="980" cy="1270" rx="24" ry="230"/>
  <ellipse class="ycoil" cx="1070" cy="1270" rx="22" ry="185"/>
  <ellipse class="gcoil" cx="1140" cy="1270" rx="20" ry="150"/>
  <rect x="1095" y="1205" width="245" height="130" rx="18" fill="url(#cyl)" stroke="#3f4952" stroke-width="2.4"/>
  <ellipse class="metal-dark" cx="1095" cy="1270" rx="25" ry="65"/>
  <ellipse class="metal" cx="1340" cy="1270" rx="25" ry="65"/>
  <rect class="metal" x="1188" y="1238" width="60" height="64" rx="8"/>
  <circle cx="1218" cy="1270" r="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text class="label" x="1218" y="1290" text-anchor="middle">O</text>
  <ellipse class="gcoil" cx="1380" cy="1270" rx="20" ry="150"/>
  <ellipse class="zcoil" cx="1440" cy="1270" rx="22" ry="195"/>

  <rect class="sensor" x="1040" y="1008" width="66" height="42" rx="5"/>
  <text class="label" x="1073" y="995" text-anchor="middle">S1</text>
  <rect class="sensor" x="1325" y="1048" width="66" height="42" rx="5"/>
  <text class="label" x="1358" y="1035" text-anchor="middle">S2</text>
  <rect class="sensor" x="1090" y="1495" width="66" height="42" rx="5"/>
  <text class="label" x="1123" y="1562" text-anchor="middle">S3</text>
  <rect class="sensor" x="1368" y="1450" width="66" height="42" rx="5"/>
  <text class="label" x="1401" y="1517" text-anchor="middle">S4</text>
  <path class="measure" d="M1073 1050 L1218 1270 M1358 1090 L1218 1270 M1123 1495 L1218 1270 M1401 1450 L1218 1270"/>

  <line class="axis-x" x1="920" y1="1605" x2="1010" y2="1605"/>
  <line class="axis-z" x1="920" y1="1605" x2="920" y2="1515"/>
  <text class="small" x="1020" y="1612">X</text>
  <text class="small" x="910" y="1503">Z</text>
  <text class="text" x="1190" y="1655" text-anchor="middle">S1、S3与S2、S4具有不同轴向坐标；全部位置 Δrᵢ 在标定前测量并固化。</text>
  <text class="small" x="1190" y="1688" text-anchor="middle">传感器支架拆除时不得改变磁力仪、线圈组和主要内生磁源的相对安装关系。</text>

  <!-- (e) 场—梯度标定原理 -->
  <rect class="frame" x="1545" y="875" width="1020" height="845" rx="5"/>
  <text class="panel-title" x="1570" y="915">（e）场—梯度观测、模型辨识与参数固化原理</text>

  <!-- 坐标定义 -->
  <g transform="translate(1650,1040)">
    <line class="axis-x" x1="0" y1="0" x2="100" y2="0"/>
    <line class="axis-y" x1="0" y1="0" x2="-70" y2="55"/>
    <line class="axis-z" x1="0" y1="0" x2="0" y2="-100"/>
    <text class="small" x="112" y="7">X（纵向）</text>
    <text class="small" x="-145" y="72">Y（横向）</text>
    <text class="small" x="-10" y="-112">Z（竖向）</text>
    <circle cx="0" cy="0" r="5" fill="#222"/>
    <text class="small" x="12" y="24">O</text>
  </g>

  <rect class="callout" x="1815" y="952" width="700" height="220" rx="5"/>
  <rect class="callout-head" x="1816" y="953" width="698" height="42" rx="4"/>
  <text class="label" x="2165" y="981" text-anchor="middle">局部一阶场观测模型</text>
  <text class="math" x="1848" y="1034">bᵢ(t) = B₀(t) + G(t)Δrᵢ + εᵢ(t),　i = 1,…,N</text>
  <text class="math" x="1848" y="1080">G = Gᵀ,　tr(G) = 0</text>
  <text class="text" x="1848" y="1120">N≥4且位置矩阵满足条件数要求；每个测点提供三轴矢量观测。</text>
  <text class="text" x="1848" y="1150">加权约束最小二乘求取 B̂₀ 及选定梯度分量 Ĝsel。</text>

  <!-- 处理链 -->
  <rect class="callout" x="1585" y="1215" width="205" height="145" rx="5"/>
  <rect class="callout-head" x="1586" y="1216" width="203" height="38" rx="4"/>
  <text class="label" x="1688" y="1243" text-anchor="middle">同步输入</text>
  <text class="small" x="1610" y="1283">• S1—SN 三轴输出</text>
  <text class="small" x="1610" y="1310">• 已知位置 Δrᵢ</text>
  <text class="small" x="1610" y="1337">• 统一时间戳</text>

  <rect class="callout" x="1850" y="1215" width="235" height="145" rx="5"/>
  <rect class="callout-head" x="1851" y="1216" width="233" height="38" rx="4"/>
  <text class="label" x="1968" y="1243" text-anchor="middle">520 约束解算</text>
  <text class="small" x="1875" y="1283">加权最小二乘</text>
  <text class="small" x="1875" y="1310">对称、无迹约束</text>
  <text class="small" x="1875" y="1337">异常剔除与条件数检查</text>

  <rect class="callout" x="2145" y="1215" width="370" height="145" rx="5"/>
  <rect class="callout-head" x="2146" y="1216" width="368" height="38" rx="4"/>
  <text class="label" x="2330" y="1243" text-anchor="middle">观测量与标定输出</text>
  <text class="small" x="2170" y="1283">参考点三轴磁场 B̂₀</text>
  <text class="small" x="2170" y="1310">选定梯度分量 Ĝsel（起步阶段优先一个主模态）</text>
  <text class="small" x="2170" y="1337">观测协方差、残差与有效性标志</text>
  <path class="line" d="M1790 1287 H1850"/>
  <path class="line" d="M2085 1287 H2145"/>

  <!-- 双支路辨识 -->
  <rect class="callout" x="1585" y="1410" width="290" height="190" rx="5"/>
  <rect class="callout-head" x="1586" y="1411" width="288" height="40" rx="4"/>
  <text class="label" x="1730" y="1439" text-anchor="middle">内生磁源标定支路</text>
  <text class="small" x="1610" y="1481">改变推进、电源、机构等工作状态</text>
  <text class="small" x="1610" y="1508">状态量 → B̂₀、Ĝsel</text>
  <text class="small" x="1610" y="1535">辨识并验证源—场传递模型310</text>
  <text class="small" x="1610" y="1562">未参与辨识的组合工况用于复核</text>

